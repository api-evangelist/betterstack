    slug: remove_chart
  - name: Add dashboard section
    description: Adds a section divider to organize charts into groups.
  - name: Configure dashboard section
    description: Updates a section's title, description or collapsed state.
  - name: Remove dashboard section
    description: Removes a section divider from a dashboard.
  - name: Move charts
    description: Rearranges chart positions on the dashboard grid.
- group: Telemetry — chart alerts
  tools:
  - name: List chart alerts
    description: Lists chart alerts with ID, name, chart and status.
  - name: Get chart alert details
    description: Shows an alert's configuration, SQL queries and current incident info.
  - name: Get chart alert instructions
    description: Instructions for creating and configuring chart alerts, including alert types
