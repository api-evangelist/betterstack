  - name: Render chart
    description: Executes a ClickHouse SQL query and renders the result as a line, bar, or pie chart.
  - name: Get query instructions
    description: Instructions for building logs and spans queries.
  - name: Get explore logs query instructions
    description: Instructions for writing queries for the Explore logs page and live-tail charts.
  - name: Get metric query instructions
    description: Instructions for building metrics queries.
  - name: Get errors query instructions
    description: Documentation for querying error data, including the two-layer errors/exceptions
