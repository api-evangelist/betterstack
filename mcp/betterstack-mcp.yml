client_plugins:
- client: Claude Code
  repository: https://github.com/BetterStackHQ/claude-plugin
  install: /plugin marketplace add BetterStackHQ/claude-plugin
  config: '{"mcpServers":{"betterstack":{"type":"http","url":"https://mcp.betterstack.com"}}}'
  note: First-party marketplace plugin; its .mcp.json points at the same remote endpoint.
- client: Codex
  repository: https://github.com/BetterStackHQ/codex-plugin
- client: Cursor
  repository: https://github.com/BetterStackHQ/cursor-plugin
plugins_note: >-
  Better Stack maintains a first-party plugin repository per agent client (Claude Code, Codex,
  Cursor). Each is a thin wrapper that registers the same https://mcp.betterstack.com remote
  endpoint — they are distribution, not additional surface, and none of them is a stdio server.
