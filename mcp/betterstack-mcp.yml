  - name: Update metric expression
    description: Updates a metric expression's name, SQL expression, type or aggregations.
  - name: Remove metric expression
    description: Deletes a metric expression from a source.
- group: Telemetry — infrastructure
  tools:
  - name: List data regions
    description: Shows available regions for storing data.
  - name: List clusters
    description: Lists storage clusters for direct data access.
  - name: List teams
    description: Shows teams with telemetry platform access.
  - name: Create cloud connection
    description: Creates temporary credentials for direct ClickHouse access.
- group: Errors — applications and releases
  tools:
  - name: List applications
    description: Shows all error tracking applications with status and configuration.
  - name: Get application details
    description: Detailed configuration, ingestion settings and available data tables.
  - name: Create application
    description: Creates new error tracking applications with platform-specific integration guides.
  - name: List releases
    description: Shows all releases for an application with first and last seen timestamps.
- group: Errors — triage
  tools:
