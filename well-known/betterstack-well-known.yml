method: probed
source: live HTTPS probes of every host in apis.yml, every OpenAPI servers[] host, the docs host, the
  three API hosts named by Better Stack's own /.well-known/api-catalog, and the MCP host named by the
  WWW-Authenticate resource_metadata challenge.
provider: Better Stack
providerId: betterstack
note: 'Better Stack serves three real discovery documents. /.well-known/api-catalog (RFC 9727) on betterstack.com
  is a linkset naming three API surfaces — uptime v2, telemetry v1 and errors v1 — each with a service-doc
  link. /.well-known/oauth-authorization-server (RFC 8414) on the same host advertises an OAuth 2.1 authorization
  server with dynamic client registration, PKCE S256 and read/write scopes; it is the authorization server
  for the Better Stack MCP server. mcp.betterstack.com serves /.well-known/oauth-protected-resource (RFC
  9728), discovered from the WWW-Authenticate challenge on a tools/list POST. status.betterstack.com is
  an SPA catch-all that answers 200 with an HTML shell for EVERY /.well-known/* path; those are recorded
  as html-shell misses, not documents.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
