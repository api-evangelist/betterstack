domain_standards:
- id: opentelemetry
  name: OpenTelemetry / OTLP
  market: observability
  conforms: true
  role: ingestion contract
  evidence: >-
    Better Stack publishes OTLP/HTTP ingestion endpoints at $INGESTING_HOST/v1/traces,
    /v1/metrics and /v1/logs with `Authorization: Bearer $SOURCE_TOKEN`, documented at
    https://betterstack.com/docs/logs/open-telemetry/. Probed live 2026-09-04: POST
    https://in.logs.betterstack.com/v1/logs returns 401 (endpoint exists, credential
    required) rather than 404. Better Stack also publishes the first-party BetterStackHQ
    `collector` (eBPF-based OpenTelemetry collector) and maintains forks of `beyla` and
    `opentelemetry-demo` in its GitHub org, and markets tracing and infrastructure monitoring
    as "OpenTelemetry-native".
  significance: >-
    This is the domain standard that matters in observability. A buyer already emitting OTLP
    points an existing exporter at Better Stack and is done — no bespoke connector, no vendor
    SDK, and no lock-in on the ingestion side. It is the strongest interoperability claim
    Better Stack makes, and unlike the JSON:API claim it holds up on the wire.
- id: clickhouse-sql
  name: ClickHouse SQL
  market: observability query
  conforms: true
  role: query contract
  evidence: >-
    Better Stack's MCP `Execute query` tool "Executes a ClickHouse SQL query against your
    telemetry data — works with logs, spans, metrics, exceptions, and replays"
    (https://betterstack.com/docs/getting-started/integrations/mcp/), and the org publishes
    a first-party `clickhouse-analyzer` (Rust SQL analyzer for ClickHouse SQL) and a
    ClickHouse fork. `Create cloud connection` issues temporary credentials for DIRECT
    ClickHouse access.
  significance: >-
    The query language is an existing open standard rather than a proprietary DSL, and the
    cloud-connection tool means a caller can bypass Better Stack's API entirely and query the
    store directly. That is unusually open for an observability vendor.
- id: prometheus
  conforms: unknown
  evidence: Not asserted. Better Stack markets metrics and Grafana dashboards (archived repo),
    but no PromQL or /metrics scrape contract was found on the public docs surface, so this is
    recorded as unknown rather than false.
