source: >-
  Derived from the four OpenAPI documents in openapi/ ($ref links, path parameters and
  id-reference fields in the request schemas), cross-checked against Better Stack's published
  MCP tool catalog and the Uptime API reference navigation
  (https://betterstack.com/docs/uptime/api).
provider: Better Stack
providerId: betterstack
caveat: >-
  The OpenAPI documents this graph is derived from are API Evangelist reconstructions from
  Better Stack's public documentation — they declare that in info.description — not a
  provider-published contract. Entities and relationships confirmed by a second source (a
  documented MCP tool or an API reference page) are marked confirmed: true; the rest are
  marked confirmed: false and should be treated as our reading, not Better Stack's schema.
id_convention:
  type: opaque string
  prefixed: false
  note: >-
    Resource ids are plain strings in the path (/monitors/{id}) with no type prefix — unlike
    Stripe-style prefixed ids, a Better Stack id carries no indication of what it identifies.
    An agent holding an id cannot tell a monitor from a heartbeat from a status page without
    remembering where it came from.
