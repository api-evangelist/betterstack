aid: betterstack
name: Better Stack
description: >-
  Better Stack is an infrastructure monitoring and observability platform that combines uptime
  monitoring, heartbeat monitoring for scheduled jobs, incident management with on-call paging
  and escalation policies, public and private status pages, log/trace/metric telemetry queried
  with ClickHouse SQL, error tracking with session replay, and an AI SRE for automated root
  cause analysis. It is OpenTelemetry-native on ingestion — OTLP/HTTP endpoints for logs,
  traces and metrics — and publishes three REST management surfaces (Uptime v2, Telemetry v1,
  Errors v1) declared in its own RFC 9727 /.well-known/api-catalog, alongside a first-party
  remote MCP server at mcp.betterstack.com exposing roughly 106 agent tools behind OAuth 2.1.
