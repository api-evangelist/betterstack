    x-lifecycle: lifecycle/betterstack-lifecycle.yml
    x-data-model: data-model/betterstack-data-model.yml
    x-idempotency:
      coverage: none
      note: No Idempotency-Key or equivalent replay protection is documented on any Better Stack write
        operation. A retried create produces a duplicate.
    x-rate-limits:
      documented: false
      note: Better Stack publishes no rate limits and returned no RateLimit-*, X-RateLimit-* or Retry-After
        header on any probed response.
    x-mcp-server:
      url: https://mcp.betterstack.com
      note: Better Stack ships a first-party remote MCP server whose tool surface is far wider than this
        REST contract. See mcp/betterstack-mcp.yml and mcp/betterstack-tool-crosswalk.yml.
- target: $.components.parameters.PerPage
  description: Correct the per_page bound. The reconstructed spec caps per_page at 50; Better Stack's
    pagination documentation states the default is 50 and the MAXIMUM is 250.
  update:
    description: Number of resources per page. Default 50, maximum 250.
    schema:
      type: integer
      minimum: 1
      maximum: 250
      default: 50
- target: $.components.parameters.Page
  description: Document the page parameter as Better Stack states it.
  update:
    description: Page to retrieve, starting from 1.
    schema:
      type: integer
      minimum: 1
      default: 1
- target: $.paths['/status-pages'].get.responses
  description: Add the error responses observed live for listStatusPages; the reconstructed contract declares
    success responses only, so a generated client has no error type.
  update:
    '401':
      description: Invalid or missing Team API token. Observed live 2026-09-04. The same body is returned
        for a missing credential and a wrong one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BetterStackError'
          example:
            errors: 'Invalid Team API token. How to find your Team API token: https://betterstack.com/docs/uptime/api/getting-started-with-uptime-api/#get-an-uptime-api-token'
    '404':
      description: Endpoint or resource not found. Routing 404s are returned before authentication is
        evaluated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BetterStackError'
          example:
            errors: Endpoint GET /api/v2/nonexistent-xyz does not exist.
            see_docs: https://betterstack.com/docs/uptime/api/getting-started-with-uptime-api/
