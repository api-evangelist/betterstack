- target: $.components.schemas
  description: Declare the proprietary error envelope observed on the wire. It is NOT the JSON:API errors
    array and NOT RFC 9457 problem+json, despite Better Stack stating the API follows JSON:API.
  update:
    BetterStackError:
      type: object
      description: Better Stack's error envelope. `errors` is a human-readable STRING, not an array of
        error objects, so there is no machine-readable error code to branch on.
      required:
      - errors
      properties:
        errors:
          type: string
          description: Human-readable failure reason.
        see_docs:
          type: string
          format: uri
          description: Documentation URL for the failing surface. Present on 404 responses.
