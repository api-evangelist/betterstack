source: >-
  Package registry metadata endpoints (registry.npmjs.org, pypi.org, rubygems.org,
  repo.packagist.org, api.nuget.org, proxy.golang.org) queried 2026-09-04, cross-checked
  against Better Stack's own docs (https://betterstack.com/docs/logs/javascript/install/,
  which names @logtail/node / @logtail/browser / @logtail/js and links
  github.com/logtail/logtail-js) and the BetterStackHQ GitHub organization.
provider: Better Stack
providerId: betterstack
note: >-
  Better Stack's client libraries are published under the legacy `logtail` npm scope, PyPI
  name, RubyGems names and Packagist vendor — Logtail is Better Stack's log-management
  product, renamed but not repackaged, and Better Stack's own installation docs still tell
  users to install those exact names. The .NET clients moved to the BetterStack prefix and
  live in the BetterStackHQ GitHub org. All of these ship telemetry INTO Better Stack; note
  that NONE of them is a client for the Uptime/Telemetry/Errors REST management APIs — for
  those Better Stack ships Terraform providers instead of an SDK, which is a real gap for an
  agent or script that wants to call the management API in a typed way.
