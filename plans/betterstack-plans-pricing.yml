specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Better Stack
providerId: betterstack
generated: '2026-09-04'
method: searched
source: https://betterstack.com/pricing
created: '2026-05-04'
modified: '2026-09-04'
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that carried invented free/pro tiers and an invented
  1,000-requests-per-month API quota. Better Stack does not meter API requests at all; it
  meters monitors, heartbeats, telemetry volume, exceptions and replays. The scaffold values
  were wrong and are removed, not amended.
tags:
  - Observability
  - Uptime Monitoring
  - Incidents
  - Logs
  - Monitoring
  - Status Pages
  - On-Call
description: >-
  Better Stack's published pricing, read from the pricing page on 2026-09-04. Pricing is
  usage-and-add-on shaped rather than tiered: a free allowance for every product, a per-seat
  Responder licence, telemetry sold in volume bundles with per-GB overage, and per-unit
  add-ons for extra monitors, status pages, call routing, SSO and audit logs. Prices are the
  monthly and annual figures shown on the page; annual figures are the discounted per-month
  equivalent Better Stack displays.
currency: USD
billing_periods: [monthly, annual]
api_metering:
  metered: false
  note: >-
    No plan meters API calls. There is no request quota, no per-call price and no published
    rate limit anywhere in Better Stack's pricing or documentation. What is metered is product
    usage — monitors, heartbeats, telemetry GB, exceptions, session replays, transaction-check
    minutes and AI SRE tokens.
plan_count: 6
plans:
  - id: free
    name: Free
    type: free
    price: '0.00'
    period: month
    description: Free allowance for personal projects, included on every account.
    entries:
      - name: monitors_and_heartbeats
        label: Monitors & heartbeats
        limit: 10
      - name: status_pages
        label: Status pages
        limit: 1
      - name: exceptions
        label: Exceptions
        limit: 100000
        timeFrame: month
      - name: session_replays
        label: Session replays
        limit: 5000
        timeFrame: month
      - name: telemetry
        label: Logs, traces and web events
        limit: 3
        unit: GB
        timeFrame: month
        note: 3GB each of logs, traces and web events, retained 3 days.
      - name: alerting
        label: Alerting
        note: Slack and email alerts.
  - id: team-member
    name: Team member (Telemetry access)
    type: seat
    price: '0.00'
    period: month
    description: A seat with Telemetry access. Free.
  - id: responder
    name: Responder (Uptime + Telemetry)
    type: seat
    price: '34.00'
    price_annual: '29.00'
    period: month
    description: A paged seat — Uptime plus Telemetry, including on-call scheduling.
  - id: telemetry-nano
    name: Telemetry bundle — Nano
    type: bundle
    price: '105.00'
    price_annual: '30.00'
    period: month
    price_note: >-
      The pricing page shows a $30–$105/month range for this bundle depending on retention and
      data options; both ends are recorded rather than picking one.
    entries:
      - name: telemetry_volume
        label: Traces, logs and metrics
        limit: 40
        unit: GB
        note: 40GB each of traces, logs and metrics.
  - id: telemetry-micro
    name: Telemetry bundle — Micro
    type: bundle
    price: '420.00'
    price_annual: '120.00'
    period: month
    price_note: $120–$420/month range shown on the pricing page.
    entries:
      - name: telemetry_volume
        label: Traces, logs and metrics
        limit: 160
        unit: GB
  - id: enterprise
    name: Enterprise
    type: enterprise
    price: null
    period: month
    description: >-
      Better Stack markets an Enterprise track (https://betterstack.com/enterprise) alongside
      the add-ons below. No all-in enterprise price is published.
additional_bundles:
  - name: Telemetry bundle — Mega
    price_range: [250.00, 875.00]
    period: month
    included: 340GB each of traces, logs and metrics
  - name: Telemetry bundle — Tera
    price_range: [500.00, 1750.00]
    period: month
    included: 700GB each of traces, logs and metrics
add_ons:
  - name: Additional uptime monitors
    price: '25.00'
    price_annual: '21.00'
    period: month
    unit: per 50 additional monitors
  - name: Additional heartbeats
    price: '20.00'
    price_annual: '17.00'
    period: month
    unit: per 10 additional heartbeats
  - name: Additional public status page
    price: '15.00'
    price_annual: '12.00'
    period: month
    unit: per page
  - name: Status page customisation (custom CSS/JS, white-label, password auth, IP allowlisting,
      domain emails)
    price_range: [15.00, 250.00]
    period: month
  - name: Slack/Teams channel- and thread-based workflows
    price: '9.00'
    period: month
    unit: per responder
    note: Basic single-channel integration is included.
  - name: Call routing phone number
    price: '250.00'
    price_annual: '208.00'
    period: month
    unit: per phone number
  - name: Reporting & analytics
    price: '5.00'
    price_annual: '4.00'
    period: month
    unit: per member
  - name: SSO (Azure / Okta)
    price: '5.00'
    period: month
    unit: per user
  - name: Audit logs
    price: '250.00'
    price_annual: '208.00'
    period: month
  - name: Transaction monitoring (Playwright)
    price: '1.00'
    unit: per 100 minutes
  - name: AI SRE
    price: '5.00'
    unit: per million tokens
overage:
  - metric: logs and traces ingestion
    price_range: [0.10, 0.35]
    unit: per GB
  - metric: log and trace retention
    price_range: [0.05, 0.18]
    unit: per GB per month
  - metric: web events ingestion
    price_range: [0.10, 0.35]
    unit: per GB
  - metric: exceptions
    price_range: [0.000050, 0.000175]
    unit: per exception beyond the 100,000 included
  - metric: session replays
    price_range: [0.00150, 0.00525]
    unit: per replay beyond the 5,000 included
